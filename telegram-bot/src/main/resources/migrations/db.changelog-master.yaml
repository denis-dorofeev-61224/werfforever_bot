databaseChangeLog:
  - changeSet:
      id: 1
      author: denis
      changes:
        - createTable:
            tableName: notification_task
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: chat_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: message
                  type: varchar(255)
              - column:
                  name: notification_time
                  type: timestamp
                  constraints:
                    nullable: false